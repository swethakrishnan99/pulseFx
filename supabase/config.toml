[functions.partner-referrals]
# Auth is verified through /auth/v1/user inside the handler, supporting current
# signing keys as well as legacy JWTs. Every data request still requires a user.
verify_jwt = false

[functions.partner-admin]
# The handler verifies the caller with Auth and requires a server-managed role.
verify_jwt = false

[functions.partner-sync]
# A server-only credential authenticates the durable queue worker. No browser access.
verify_jwt = false

[functions.partner-banking]
# Auth and enabled membership are verified inside the handler.
verify_jwt = false

[functions.partner-payouts]
# Auth, enabled partner membership and administrator sessions are verified inside the handler.
verify_jwt = false

[functions.pulsefx-user-admin]
# Internal PulseFX account management requires a live, server-verified admin session.
verify_jwt = false

[functions.partner-support]
# Auth and active partner membership are verified inside the handler.
verify_jwt = false

[functions.partner-brand-kit]
# Auth and active partner membership are verified inside the handler.
verify_jwt = false

[functions.pulsefx-brand-assets]
# Auth and active partner membership are verified inside the handler.
verify_jwt = false

[functions.pulsefx-one-pagers]
# Auth and active partner membership are verified inside the handler.
verify_jwt = false

[functions.pulsefx-documents]
# Live Auth user, admin role and active session are verified inside the handler.
verify_jwt = false
